<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="icons/favicon.png" type="image/x-icon" />
    <title>Netflix | Download all Movie in one Step</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mainContainer">
      <div class="navbar">
        <div class="logoImg">
          <img src="assets/Brand_Logo.png" alt="" />
        </div>
        <div class="navContent">
          <button class="button" id="langBtn">English</button>
          <button class="button" id="signBtn">Sign In</button>
        </div>
      </div>
      <div class="mainHeading">
        <h1 id="mainHead">Unlimited movies, TV shows, and more</h1>
        <p id="mainPara">Start at ₹149.Cancel at any time.</p>
        <p id="mainParagraph">
          Ready to watch? Enter your email address to create or restart your
          membership
        </p>
        <div class="inputBtn">
          <input type="text" placeholder="Email address" />
          <button class="btn">
            Get started <i class="fa fa-angle-right"></i>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
