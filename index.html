<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="icons/favicon.png" type="image/x-icon" />
    <title>Netflix India - Watch TV Shows & Movie Online</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mainContainer">
      <navbar class="navbar">
        <div class="logoImg">
          <img src="assets/Brand_Logo.png" alt="" />
        </div>
        <div class="navContent">
          <button class="button" id="langBtn">English</button>
          <button class="button" id="signBtn">Sign In</button>
        </div>
      </navbar>
      <section class="mainHeading">
        <h1 id="mainHead">Unlimited movies, TV shows, and more</h1>
        <p id="mainPara">Start at ₹149.Cancel at any time.</p>
        <p id="mainParagraph">
          Ready to watch? Enter your email address to create or restart your
          membership
        </p>
        <div class="inputBtn">
          <input type="text" placeholder="Email address" />
          <button class="btn">
            Get started <i class="fa fa-angle-right"></i>
          </button>
        </div>
      </section>
      <section class="curve"></section>
    </div>
    <section class="movieList">
      <div class="sectionHeading">
        <h3 id="sectionHead">trending boat</h3>
      </div>
      <div class="mList">
        <div class="sectionCard">
          <img src="assets/dhurandhar.jpg" alt="" id="cardImg" />
          <p id="sectionCont">1</p>
        </div>
        <div class="sectionCard">
          <img src="assets/taskaree.jpg" alt="" id="cardImg" />
          <p id="sectionCont">2</p>
        </div>
        <div class="sectionCard">
          <img src="assets/tere-ishq-me.jpg" alt="" id="cardImg" />
          <p id="sectionCont">3</p>
        </div>
        <div class="sectionCard">
          <img src="assets/haq.webp" alt="" id="cardImg" />
          <p id="sectionCont">4</p>
        </div>
        <div class="sectionCard">
          <img src="assets/MV5BMGde-de-pyar-de-2.jpg" alt="" id="cardImg" />
          <p id="sectionCont">5</p>
        </div>
      </div>
    </section>
    <section class="join">
      <div class="joinHeading">
        <h3 id="joinHead">more reasons to join</h3>
      </div>
      <div class="joinCard">
        
      </div>
    </section>
  </body>
</html>
